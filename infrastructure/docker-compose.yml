version: '3.8'

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: iacms-postgres
    environment:
      POSTGRES_DB: iacms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — used ONLY by api-gateway for RBAC caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: iacms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: iacms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: iacms-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Services ──────────────────────────────────────────────────────────────

  # API Gateway — the only service that uses Redis (caching + rate limiting)
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: iacms-api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      RBAC_SERVICE_URL: http://rbac-service:3002
      CASE_SERVICE_URL: http://case-service:3003
      WORKFLOW_SERVICE_URL: http://workflow-service:3004
      REFERRAL_SERVICE_URL: http://referral-service:3005
      AUDIT_SERVICE_URL: http://audit-service:3006
      INTEGRATION_SERVICE_URL: http://integration-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_RATE_LIMIT_MAX: 10
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Auth Service — PostgreSQL + Kafka only
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: iacms-auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: change-this-secret-key
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # RBAC Service — PostgreSQL + Kafka only
  rbac-service:
    build:
      context: ..
      dockerfile: services/rbac-service/Dockerfile
    container_name: iacms-rbac-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Case Service — PostgreSQL + Kafka only
  case-service:
    build:
      context: ..
      dockerfile: services/case-service/Dockerfile
    container_name: iacms-case-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Workflow Service — PostgreSQL + Kafka only
  workflow-service:
    build:
      context: ..
      dockerfile: services/workflow-service/Dockerfile
    container_name: iacms-workflow-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Referral Service — PostgreSQL + Kafka only
  referral-service:
    build:
      context: ..
      dockerfile: services/referral-service/Dockerfile
    container_name: iacms-referral-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Audit Service — PostgreSQL + Kafka only
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    container_name: iacms-audit-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Integration Service — PostgreSQL + Kafka only
  integration-service:
    build:
      context: ..
      dockerfile: services/integration-service/Dockerfile
    container_name: iacms-integration-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Notification Service — Kafka only (no database)
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: iacms-notification-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

volumes:
  postgres_data:
  kafka_data:

networks:
  iacms-network:
    driver: bridge
