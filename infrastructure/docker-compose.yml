services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: iacms-postgres
    networks:
      - iacms-network
    environment:
      POSTGRES_DB: iacms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — api-gateway: sessions (connect-redis), RBAC cache, rate limiting
  redis:
    image: redis:7-alpine
    container_name: iacms-redis
    networks:
      - iacms-network
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft mode — no Zookeeper required) ───────────────────────────
  # KRaft combined mode: single container acts as both broker and controller.
  # Supported for development/single-node use on Confluent Platform 7.5+.
  # CLUSTER_ID must be a stable base64url-encoded UUID — do NOT change after
  # first boot (Kafka stores it in the kafka_data volume).
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: iacms-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      # Listener map — preserves the same names used by all downstream services:
      #   PLAINTEXT_INTERNAL  → inter-service broker address (kafka:29092)
      #   PLAINTEXT           → host/LAN client address    (LAN_HOST:9092)
      #   CONTROLLER          → KRaft controller quorum    (kafka:29093, internal only)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://${LAN_HOST:-localhost}:9092,PLAINTEXT_INTERNAL://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      # Stable cluster ID — generated once. Change only if you wipe kafka_data volume.
      CLUSTER_ID: 'YTLpC6THQDGbzV3TZQtVUw'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Use the internal listener — host-advertised PLAINTEXT address is not
      # always reachable from inside the container when LAN_HOST is an external IP.
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:29092 --list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - iacms-network

  # ── Services ──────────────────────────────────────────────────────────────

  # API Gateway — the only service that uses Redis (caching + rate limiting)
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: iacms-api-gateway
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
      IAM_SERVICE_URL: http://iam-service:3001
      AUTH_SERVICE_URL: http://iam-service:3001
      RBAC_SERVICE_URL: http://iam-service:3001
      CASE_ENGINE_SERVICE_URL: http://case-engine-service:3003
      CASE_SERVICE_URL: http://case-engine-service:3003
      WORKFLOW_SERVICE_URL: http://case-engine-service:3003
      REFERRAL_SERVICE_URL: http://case-engine-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3006
      INTEGRATION_SERVICE_URL: http://integration-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      FILE_SERVICE_URL: http://file-service:3009
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_RATE_LIMIT_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam-service:
        condition: service_started
      case-engine-service:
        condition: service_started
      kafka:
        condition: service_healthy
      file-service:
        condition: service_started
    networks:
      - iacms-network

  # IAM Service — Auth + RBAC (PostgreSQL + Kafka)
  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    container_name: iacms-iam-service
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      IAM_SERVICE_URL: http://localhost:3001
      CASE_ENGINE_SERVICE_URL: http://case-engine-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3006
      INTEGRATION_SERVICE_URL: http://integration-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      FILE_SERVICE_URL: http://file-service:3009
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Case Engine Service — Case + Workflow + Referral (PostgreSQL + Kafka)
  case-engine-service:
    build:
      context: ..
      dockerfile: services/case-engine-service/Dockerfile
    container_name: iacms-case-engine-service
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Audit Service — PostgreSQL + Kafka only
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    container_name: iacms-audit-service
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Integration Service — PostgreSQL + Kafka only
  integration-service:
    build:
      context: ..
      dockerfile: services/integration-service/Dockerfile
    container_name: iacms-integration-service
    ports:
      - '3007:3007'
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # Notification Service — Kafka only (no database)
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: iacms-notification-service
    ports:
      - '3008:3008'
    env_file:
      - ../services/notification-service/.env
    environment:
      PORT: 3008
      KAFKA_BROKERS: kafka:29092
      APP_URL: ${APP_URL:-http://localhost:5173}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iacms-network

  # MinIO — S3-compatible object storage (data-network only, never exposed to clients)
  minio:
    image: quay.io/minio/minio:latest
    container_name: iacms-minio
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iacms-network

  # MinIO init — creates the iacms-files bucket on first boot
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: iacms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/iacms-files;
        mc anonymous set none local/iacms-files;
        exit 0;
      "
    networks:
      - iacms-network

  # ClamAV — virus scanning sidecar (disabled by default via VIRUS_SCAN_ENABLED=false)
  clamav:
    image: clamav/clamav:stable
    container_name: iacms-clamav
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - iacms-network

  # File Management Service (HTTP)
  file-service:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
      target: http
    container_name: iacms-file-service
    ports:
      - '3009:3009'
    environment:
      PORT: 3009
      NODE_ENV: development
      WORKER_MODE: standalone
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      AUTH_SERVICE_URL: http://iam-service:3001
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: iacms-files
      MINIO_USE_SSL: 'false'
      VIRUS_SCAN_ENABLED: 'false'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      THUMBNAIL_ENABLED: 'true'
      COMPRESSION_IMAGE_ENABLED: 'true'
      COMPRESSION_VIDEO_ENABLED: 'false'
      DEDUPLICATION_ENABLED: 'false'
      DEFAULT_SOFT_DELETE_DAYS: '30'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - iacms-network

  # File Management Service workers (virus scan, compress, thumbs, cleanup)
  # Uses the `workers` stage from the shared Dockerfile (ffmpeg + same deps layer).
  file-service-workers:
    build:
      context: ..
      dockerfile: services/file-service/Dockerfile
      target: workers
    container_name: iacms-file-service-workers
    environment:
      NODE_ENV: development
      WORKER_MODE: standalone
      DATABASE_URL: postgresql://postgres:postgres@iacms-postgres:5432/iacms?schema=public
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: iacms-files
      MINIO_USE_SSL: 'false'
      VIRUS_SCAN_ENABLED: 'false'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      THUMBNAIL_ENABLED: 'true'
      COMPRESSION_IMAGE_ENABLED: 'true'
      COMPRESSION_VIDEO_ENABLED: 'false'
      DEFAULT_SOFT_DELETE_DAYS: '30'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - iacms-network

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  clamav_data:

networks:
  iacms-network:
    driver: bridge
