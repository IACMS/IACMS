# Production overlay — use with base compose and a filled .env.prod:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Only the API gateway is published on the host. Internal microservices are reachable
# only on the Docker network. Postgres / Redis bind to localhost for admin access.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5434:5432'
    restart: unless-stopped

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6380:6379'
    restart: unless-stopped

  zookeeper:
    ports:
      - '127.0.0.1:2182:2181'
    restart: unless-stopped

  kafka:
    ports:
      - '127.0.0.1:9094:9092'
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  minio-init:
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} '${MINIO_ROOT_PASSWORD}';
        mc mb --ignore-existing local/iacms-files;
        mc anonymous set none local/iacms-files;
        exit 0;
      "

  clamav:
    restart: unless-stopped

  api-gateway:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

  iam-service:
    ports: []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  case-engine-service:
    ports: []
    environment:
      NODE_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  audit-service:
    ports: []
    environment:
      NODE_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  integration-service:
    ports: []
    environment:
      NODE_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  notification-service:
    ports: []
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
    restart: unless-stopped

  file-service:
    ports: []
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AUTH_SERVICE_URL: http://iam-service:3001
      VIRUS_SCAN_ENABLED: 'true'
    restart: unless-stopped

  file-service-workers:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VIRUS_SCAN_ENABLED: 'true'
    restart: unless-stopped
